<!DOCTYPE html lang="ca">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
              integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
              integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<html>
    <head> 
        <meta charset="UTF-8">
        <title>Estudi qualitat aire</title>
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    </head>

    <style>
        .select2-container {
             width: 100% !important;
        }

        .select2-container--default .select2-selection--multiple {
            min-height: calc(2.5rem + 2px);
            padding: 0.25rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
        }

        .select2-selection__rendered {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        body {
            overflow-x: hidden;
        }

        .select2-dropdown {
            max-width: 100%;
            box-sizing: border-box;
        }

    </style>
<body>
    <div class="container">
        <h2>Filtra les dades per analitzar en detall els resultats obtinguts</h2>
        <div class="mb-4">
            <b>Selecciona els filtres que vulguis aplicar</b>
            <form name="filters" class="p-3 border rounded bg-light">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <label for="datefilter">Rang de dates:</label>
                        <input type="text" name="datefilter" value="" required>
                        <input type="hidden" name="startdate" value="">
                        <input type="hidden" name="enddate" value="">
                    </div>
                    
                    <div class="col-12 col-md-3">
                        <label class="form-label d-block">Contaminant</label>
                        <select name="gas" class="form-select select2" multiple>
                            {% for gas in pollution_gas %}
                                <option value="{{ gas.id }}"> {{ gas.name_gas }} ({{gas.units}}) </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label d-block">Estació</label>
                        <select name="station" class="form-select select2" multiple>
                            {% for station in stations %}
                                <option value="{{ station.id }}"> {{station.name_station}} </option>
                            {% endfor %}
                        </select>
                    </div>

                    

                <div class="d-flex justify-content-end mt-4">
                    <button type="button" class="btn btn-primary px-4" data-action="submit">
                        <i class="fa fa-search me-2"></i>Cercar
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center">
            <i class="fa fa-spinner fa-spin fa-4x" id="loadingResults" style="display: none;"></i>
        </div>
        <div>
            <div id="results">
                
            </div>
        </div>
    </div>  

<script>

    $(document).ready(function(){
        initialize_datetime_range();
        initialize_select2();
    });

    $("body").on("click", "[data-action='submit']", function() {
        const dateRange = $('[name="datefilter"]').val();
        const gas = $('[name="gas"]').select2('data');
        const station = $('[name="station"]').select2('data');

        if (!dateRange) {
            alert("És necessari seleccionar un rang de dates per a poder filtrar.")
            return
        }

        if (gas.length == 0) {
            alert("És necessari seleccionar almenys un contaminant per a poder filtrar.")
            return
        }

        $('#loadingResults').show();
        $("#results").html("");

        const filtersSelected = {};

        filtersSelected.startDate = $("[name=startdate]").val();
        filtersSelected.endDate = $("[name=enddate]").val();
        
        filtersSelected.pollutionGas = [];

        for (let i = 0; i < gas.length; i++) {
            filtersSelected.pollutionGas.push(gas[i].id);
        }

        filtersSelected.stations = [];

        for (let i = 0; i < station.length; i++) {
            filtersSelected.stations.push(station[i].id);
        }


        $.ajax({
                url: '/statistics/filter-results',
                method: 'POST',
                data: { data_to_filter: JSON.stringify(filtersSelected) },
                success: function(data) {
                    $('#loadingResults').hide();
                    $("#results").html(data);
                }
            });
    });


    function initialize_select2() {
        $('.select2').select2();
    }

    function initialize_datetime_range() {
         $('input[name="datefilter"]').daterangepicker({
            autoUpdateInput: false,
            locale: {
                cancelLabel: 'Netejar'
            }
        });

        $('input[name="datefilter"]').on('apply.daterangepicker', function(ev, picker) {
            $(this).val(picker.startDate.format('DD/MM/YYYY') + ' - ' + picker.endDate.format('DD/MM/YYYY'));
            $("[name=startdate]").val(picker.startDate.format('YYYY-MM-DD'));
            $("[name=enddate]").val(picker.endDate.format('YYYY-MM-DD'));
        });

        $('input[name="datefilter"]').on('cancel.daterangepicker', function(ev, picker) {
            $(this).val('');
            $("[name=startdate]").val('');
            $("[name=enddate]").val('');
        });
    }

</script>

</body>
</html>
